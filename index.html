<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio - localStorage</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class= "d-flex justify-content-center align-items-center vh-100">
        <div class="card w-100 d-flex px-3 py-3" style="max-width: 500px;">
            <img src="img/icon music.jpg" class="imagem" alt="icon musica">
            <hr>
            <h2 class="fw-bold display-7"> Minhas Músicas Favoritas</h2>
            <hr>
            <p class="fw-bold lead"><i class="bi bi-plus-circle"></i> Adicionar à coleção:</p>
            <label for="musica" class="form-label">Nome da música:</label>
            <div class="input-group mb-3">
                <input type="text" id="musica" class="form-control" placeholder="Digite o título da música">
            </div>
            <label for="artista" class="form-label">Nome do artista:</label>
            <div class="input-group mb-3">
                <input type="text" id="artista" class="form-control" placeholder="Quem interpreta?">
            </div>
            <button id="adicionarMusica" class="btn btn-danger" type="button"> <i class="bi bi-heart"></i> Adicionar Música</button>
            <hr>
            <h3 class="fw-bold lead"><i class="bi bi-music-note-beamed"></i> Minha playlist:</h3>
            <ul id="listaMusicas"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
